version: '3.8'

services:
  # Frontend - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://porygon:porygon@postgres:5432/porygon_db
      - MQTT_HOST=emqx
      - MQTT_PORT=1883
      - SECRET_KEY=porygon-industrial-os-secret-key
    depends_on:
      - postgres
      - emqx
    volumes:
      - ./backend/app:/app/app

  # PostgreSQL + TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=porygon
      - POSTGRES_PASSWORD=porygon
      - POSTGRES_DB=porygon_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  # EMQX MQTT Broker
  emqx:
    image: emqx/emqx:5.3.0
    ports:
      - "1883:1883"   # MQTT
      - "8083:8083"   # MQTT WebSocket
      - "8084:8084"   # MQTT WSS
      - "18083:18083" # Dashboard
    environment:
      - EMQX_NAME=porygon_mqtt
      - EMQX_HOST=0.0.0.0
    volumes:
      - emqx_data:/opt/emqx/data

volumes:
  postgres_data:
  emqx_data:
