services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${WS_URL:-ws://localhost:8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - backend
    restart: unless-stopped

  digital-twin:
    build:
      context: ./digital-twin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAIN_APP_URL: ${SIM_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_MAIN_APP_URL=${SIM_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:8000}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://porygon:porygon@postgres:5432/porygon_db
      - MQTT_HOST=emqx
      - MQTT_PORT=1883
      - SECRET_KEY=${SECRET_KEY:-change-me-in-prod}
    depends_on:
      - postgres
      - emqx
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=porygon
      - POSTGRES_PASSWORD=porygon
      - POSTGRES_DB=porygon_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.3.0
    ports:
      - "1883:1883"
      - "18083:18083"
    environment:
      - EMQX_NAME=porygon_mqtt
      - EMQX_HOST=0.0.0.0
    volumes:
      - emqx_data:/opt/emqx/data
    restart: unless-stopped

volumes:
  postgres_data:
  emqx_data:
